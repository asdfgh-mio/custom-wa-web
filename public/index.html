<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Launcher</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; text-align: center; }
        button { margin-top: 15px; padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .loading { display: none; margin-top: 15px; color: #ff9900; font-weight: bold; }
        .success { color: green; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Upload creds.json</h2>
        <input type="file" id="fileInput" accept=".json">
        <br>
        <button onclick="startBot()">Upload & Start Bot</button>
        
        <div id="loader" class="loading">Uploading & Starting Bot... Please Wait...</div>
        <div id="status" class="success"></div>
    </div>

    <script>
        async function startBot() {
            const fileInput = document.getElementById('fileInput');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');

            if (!fileInput.files.length) {
                alert("Please select your creds.json file first!");
                return;
            }

            const formData = new FormData();
            formData.append('credsFile', fileInput.files[0]);

            // Show loading UI
            loader.style.display = 'block';
            status.innerText = '';
            fileInput.disabled = true;

            try {
                const response = await fetch('/upload-and-start', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                // Hide loader and show success message
                loader.style.display = 'none';
                status.innerText = result.message;
            } catch (error) {
                loader.style.display = 'none';
                status.style.color = 'red';
                status.innerText = "Error starting bot. Check server logs.";
            } finally {
                fileInput.disabled = false;
            }
        }
    </script>
</body>
</html>
